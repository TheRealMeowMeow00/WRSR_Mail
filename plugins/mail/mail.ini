; WRSR Mail by TheRealMeowMeow00, GPL-3.0-only. Settings. UTF-8, no BOM.

[mail]

; 0 = do not hook anything.
enabled = 1

; Seconds between statistics lines in the log. 0 = no lines.
log_seconds = 60

; 1 = add the resources mail_raw and mail_done, the storages and the need.
; Buildings made before this was on have no mail storages. Use a new map.
; The mail buildings require this: without the resources they can crash the game while it loads.
resources = 1

; Names in the game's windows, UTF-8. Empty: English, or Russian if the game is in Russian.
caption_raw =
caption_done =

; Processed mail one resident uses per game day, in grams, at some years. Straight lines
; between them, flat before the first and after the last. Letters in 1920, parcels in 2020.
; Five people use five times what one does. Raw mail grows along: mail_per_waste holds at the
; use of mail_use_reference grams. Late in the game a house may need a truck every day, which
; is meant. Empty the table to freeze everything at 300 g.
mail_use_by_year = 1920:100 1950:300 1980:500 2000:800 2020:1200
mail_use_reference = 300
; Mail storage of every waste producing building. Multiplied by the resource's class
; factor in the window: 0.6 shows as 0.21 t. Takes effect on a new map.
mail_capacity = 0.6
; A truck comes at this fill.
mail_threshold = 0.25
; A trip is worth this share of a truck, unless a building is nearly full or, for delivery,
; empty. Keeps trucks from running for a handful of letters.
mail_min_batch = 0.25

; ---- what mail does for people, per game day, for each resident.
; Mail in the house: happiness up by this.
mail_happy_bonus = 0.02
; No mail, and a mail service covers the house: happiness down by this. Houses no service
; covers feel nothing.
mail_happy_debuff = 0.03
; How far from the game's own happiness limit of the house mail can move people, 0.25 is
; a quarter of the limit either way.
mail_happy_range = 0.25

; ---- going out of date. Share a warehouse loses per mail day, 60 units of game time. A
; slowed calendar does not change it. On a truck, in a house and in a factory mail does not
; age. 0.0025 halves an untouched stock in about 280 days. 0 turns it off.
mail_decay_per_day = 0.0025

; ---- trade. Prices are set here so that processing foreign mail earns the factory its
; wages plus this share: processed mail sells for the price of raw mail plus that. It lowers
; the price of processed mail. Below zero leaves the prices to the game: raw mail is then free.
mail_trade_margin = 1.0
; The import price of raw mail, in worker days per tonne. Prices follow the wage, so they
; keep up with the inflation of the market.
mail_trade_raw_days = 40

; ---- a house stores each kind of mail by its size, this many kg per resident it has room for,
; at least 50 kg and at most about 1.7 t. 1.5 keeps about 3 days of mail in 1980. 0 turns it
; off and houses keep mail_capacity. Other buildings always keep mail_capacity.
mail_home_kg_per_resident = 1.5

; ---- which covered trucks a mail service may buy: names or parts of names, as in the game's
; vehicle folders, split by spaces or commas. For example: covered_rnt covered_skd
; Empty: every covered truck. Trucks already in a service keep working when this changes.
; Only covered trucks can carry mail, a name of anything else does nothing.
mail_vehicles =

; ---- 1 = mail trucks may go for houses without a road, as garbage trucks do. It also makes
; them ignore road signs, as garbage trucks do. Read when the game starts.
mail_foot_paths = 1

; ---- the "Mail" tab in the build menu, after the industry tabs, with the buildings of this
; mod. 0 leaves the menu as the game makes it; the buildings stay in the Workshop menu.
; The log says "mail  tab:".
mail_tab = 1
; Mail buildings of other mods for the same tab, as <workshop id>/<building folder>,
; separated by spaces. A name the game does not know is skipped.
mail_tab_extra =

; ---- a truck that for this many seconds of running game does not move, change its stop or
; change its cargo goes back to its office, as with the depot button. The log says
; "mail  stuck:". 0 turns it off.
mail_stuck_seconds = 90

; ---- dispatch.
; 1 = send the mail trucks.
dispatch = 1
; Buildings per route. 0 = what fills the truck, 1 to 24 fixes it. Multi stop routes are
; NOT verified in the game yet. If they keep ending with cargo on board the plugin falls
; back to one stop by itself and says so in the log.
max_stops = 0

; ---- only for the old prototype, when resources = 0.
resource_name = eletronics
max_orders = 3
